name: Update PyPI download statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PyPI statistics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile/stats

          packages=(
            "darn-it"
            "adran"
            "llun"
            "llun-mcp"
          )

          for package in "${packages[@]}"; do
            file="profile/stats/${package}.json"
            url="https://pypistats.org/api/packages/${package}/recent?period=month"

            echo "Updating ${package}..."

            if downloads=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              "$url" | jq -r '.data.last_month'); then

              jq -n \
                --arg message "$downloads" \
                '{
                  schemaVersion: 1,
                  label: " ${package} monthly downloads",
                  message: $message
                }' > "$file"

              echo "${package}: ${downloads}"
            else
              echo "Failed to retrieve ${package}; keeping existing value."

              if [ ! -f "$file" ]; then
                echo "No existing value for ${package}; failing."
                exit 1
              fi
            fi
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update PyPI download statistics"
          git push