name: Update PyPI download statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PyPI statistics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile/stats

          packages=(
            "darn-it"
            "adran"
            "llun"
            "llun-mcp"
          )

          for package in "${packages[@]}"; do
            file="profile/stats/${package}.json"
            url="https://pypistats.org/api/packages/${package}/recent?period=month"

            echo "Updating ${package}..."

            existing_message=""
            if [ -f "$file" ]; then
              existing_message=$(jq -r '.message // empty' "$file" 2>/dev/null || true)
            fi

            if raw_downloads=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              "$url"); then
              downloads=$(printf '%s' "$raw_downloads" | jq -r '.data.last_month // empty')

              if [ -z "$downloads" ] || [ "$downloads" = "null" ]; then
                if [[ "$existing_message" =~ ^[0-9]+$ ]]; then
                  downloads="$existing_message"
                  echo "No new monthly value for ${package}; keeping existing integer value: ${downloads}."
                else
                  downloads="n/a"
                  echo "No monthly download value available for ${package}; using fallback badge text."
                fi
              fi
            else
              if [[ "$existing_message" =~ ^[0-9]+$ ]]; then
                downloads="$existing_message"
                echo "Failed to retrieve ${package}; keeping existing integer value: ${downloads}."
              else
                downloads="n/a"
                echo "Failed to retrieve ${package}; no valid previous integer value was available, using fallback badge text."
              fi
            fi

            label="${package} monthly downloads"

            jq -n \
              --arg message "$downloads" \
              --arg label "$label" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $message
              }' > "$file"

            echo "${package}: ${downloads}"
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update PyPI download statistics"
          git push