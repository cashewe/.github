name: Update PyPI download statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PyPI statistics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile/stats

          packages=(
            "darn-it"
            "adran"
            "camau"
            "llun"
            "llun-mcp"
          )

          for package in "${packages[@]}"; do
            file="profile/stats/${package}.json"
            lifetime_file="profile/stats/${package}-lifetime.json"
            version_file="profile/stats/${package}-version.json"
            url="https://pypistats.org/api/packages/${package}/recent?period=month"
            lifetime_url="https://pypistats.org/api/packages/${package}/overall?period=all"
            version_url="https://pypi.org/pypi/${package}/json"

            echo "Updating ${package}..."

            existing_message=""
            if [ -f "$file" ]; then
              existing_message=$(jq -r '.message // empty' "$file" 2>/dev/null || true)
            fi

            existing_lifetime_message=""
            if [ -f "$lifetime_file" ]; then
              existing_lifetime_message=$(jq -r '.message // empty' "$lifetime_file" 2>/dev/null || true)
            fi

            if raw_downloads=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              "$url"); then
              downloads=$(printf '%s' "$raw_downloads" | jq -r '.data.last_month // empty')

              if [ -z "$downloads" ] || [ "$downloads" = "null" ]; then
                if [[ "$existing_message" =~ ^[0-9]+$ ]]; then
                  downloads="$existing_message"
                  echo "No new monthly value for ${package}; keeping existing integer value: ${downloads}."
                else
                  downloads="n/a"
                  echo "No monthly download value available for ${package}; using fallback badge text."
                fi
              fi
            else
              if [[ "$existing_message" =~ ^[0-9]+$ ]]; then
                downloads="$existing_message"
                echo "Failed to retrieve ${package}; keeping existing integer value: ${downloads}."
              else
                downloads="n/a"
                echo "Failed to retrieve ${package}; no valid previous integer value was available, using fallback badge text."
              fi
            fi

            if raw_lifetime_downloads=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              "$lifetime_url"); then
              lifetime_downloads=$(printf '%s' "$raw_lifetime_downloads" | jq -r '[.data[] | select(.category == "without_mirrors") | .downloads] | add // empty')

              if [ -z "$lifetime_downloads" ] || [ "$lifetime_downloads" = "null" ]; then
                if [[ "$existing_lifetime_message" =~ ^[0-9]+$ ]]; then
                  lifetime_downloads="$existing_lifetime_message"
                  echo "No lifetime value for ${package}; keeping existing integer value: ${lifetime_downloads}."
                else
                  lifetime_downloads="n/a"
                  echo "No lifetime download value available for ${package}; using fallback badge text."
                fi
              fi
            else
              if [[ "$existing_lifetime_message" =~ ^[0-9]+$ ]]; then
                lifetime_downloads="$existing_lifetime_message"
                echo "Failed to retrieve lifetime downloads for ${package}; keeping existing integer value: ${lifetime_downloads}."
              else
                lifetime_downloads="n/a"
                echo "Failed to retrieve lifetime downloads for ${package}; no valid previous integer value was available, using fallback badge text."
              fi
            fi

            existing_version_message=""
            if [ -f "$version_file" ]; then
              existing_version_message=$(jq -r '.message // empty' "$version_file" 2>/dev/null || true)
            fi

            if raw_version=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              "$version_url"); then
              version=$(printf '%s' "$raw_version" | jq -r '.info.version // empty')

              if [ -z "$version" ] || [ "$version" = "null" ]; then
                if [ -n "$existing_version_message" ]; then
                  version="$existing_version_message"
                  echo "No version value for ${package}; keeping existing value: ${version}."
                else
                  version="n/a"
                  echo "No version value available for ${package}; using fallback badge text."
                fi
              fi
            else
              if [ -n "$existing_version_message" ]; then
                version="$existing_version_message"
                echo "Failed to retrieve version for ${package}; keeping existing value: ${version}."
              else
                version="n/a"
                echo "Failed to retrieve version for ${package}; no valid previous value was available, using fallback badge text."
              fi
            fi

            label="monthly downloads"
            lifetime_label="total downloads"
            version_label="version"

            jq -n \
              --arg message "$downloads" \
              --arg label "$label" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $message
              }' > "$file"

            jq -n \
              --arg message "$lifetime_downloads" \
              --arg label "$lifetime_label" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $message
              }' > "$lifetime_file"

            jq -n \
              --arg message "$version" \
              --arg label "$version_label" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $message
              }' > "$version_file"

            echo "${package}: ${downloads} monthly, ${lifetime_downloads} lifetime, version ${version}"
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update PyPI download statistics"
          git push